[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rensim-tools"
version = "0.1.1"
description = "A Claude desktop extension for Renaissance (play-by-mail): your turn results in a database, and orders checked before you send them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "dlt[duckdb]==1.31.0",
    "duckdb==1.5.6",
    "mcp==2.3.0",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "splink==5.0.0",
]

[project.scripts]
rensim-mcp = "renaissance.mcp_server:main"

[tool.setuptools]
packages = ["renaissance"]

[tool.setuptools.package-data]
renaissance = ["sql/*.sql", "dbt/**/*.sql", "dbt/**/*.yml", "claims_extraction.md"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rensim-tools"
version = "0.1.0"
description = "Parse Renaissance (play-by-mail) turn results and newsletters into a database, and check your orders before sending them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "dlt[duckdb]==1.31.0",
    "duckdb==1.5.6",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
extract = ["Pillow"]

[project.scripts]
rensim = "renaissance.cli:main"

[tool.setuptools]
packages = ["renaissance"]

[tool.setuptools.package-data]
renaissance = ["sql/*.sql", "dbt/**/*.sql", "dbt/**/*.yml"]

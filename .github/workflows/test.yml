# On every push and pull request: the tests (made-up account in tests/fixtures, every MCP tool
# through the real server), then a load of the fixtures, dbt's build and docs site, and the
# extension checked and packed.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Tests
        run: python -m unittest -v
      - name: Load the fixtures
        working-directory: tests/fixtures
        run: python -m renaissance.run
      - name: dbt build (every model, then every test)
        working-directory: tests/fixtures
        run: python -m renaissance.dbt_runner build
      - name: dbt docs
        working-directory: tests/fixtures
        run: python -m renaissance.dbt_runner docs generate --static
      # Download it from the run's summary page and open static_index.html in a browser.
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: tests/fixtures/.dbt/target/static_index.html
      - name: The extension's manifest is valid and it packs
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . rensim.mcpb

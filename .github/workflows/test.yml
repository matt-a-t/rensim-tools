# On every push and pull request: the tests (made-up account in tests/fixtures), then every command
# end to end on the fixtures, then dbt builds and tests the views and generates their docs site.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[match]"
      - name: Tests
        run: python -m unittest -v
      - name: Every command on the fixtures
        working-directory: tests/fixtures
        run: |
          rensim config
          rensim run
          rensim ask
          rensim quality
          rensim claims
          rensim orders orders/tst_1547-04.txt
          rensim training
          rensim match
      - name: dbt build (every model, then every test)
        working-directory: tests/fixtures
        run: rensim dbt build
      - name: dbt docs
        working-directory: tests/fixtures
        run: rensim dbt docs generate --static
      # Download it from the run's summary page and open static_index.html in a browser.
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: tests/fixtures/.dbt/target/static_index.html
